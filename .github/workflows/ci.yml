
name: ChatApplication DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - github-actions-devsecops
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: chatapplication-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # STAGE 0: PREPARATION
  prep:
    name: Pipeline Preparation
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Generate image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


  # STAGE 1: CODE QUALITY
  code-quality:
    name: Code Quality
    needs: prep
    uses: ./.github/workflows/code-quality.yml


  # STAGE 2: SECRET SCANNING
  secret-scanning:
    name: Secret Scanning
    needs: code-quality
    uses: ./.github/workflows/secret-scanning.yml


  # STAGE 3: DEPENDENCY SCANNING
  dependency-scan:
    name: Dependency Security
    needs: secret-scanning
    uses: ./.github/workflows/dependency-scan.yml


  # STAGE 4: SAST
  codeql:
    name: CodeQL SAST
    needs: dependency-scan
    uses: ./.github/workflows/codeql-scan.yml


  # STAGE 5: DOCKERFILE SECURITY
  dockerfile-lint:
    name: Dockerfile Security
    needs: codeql
    uses: ./.github/workflows/dockerfile-lint.yml


  # STAGE 6: CONTAINER SECURITY
  container-security:
    name: Container Build and Trivy
    needs:
      - prep
      - dockerfile-lint
    uses: ./.github/workflows/container-security.yml
    with:
      image_tag: ${{ needs.prep.outputs.tag }}

